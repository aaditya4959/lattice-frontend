<!-- @dsCard group="Overlays" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dialog</title>
<style>
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --radius: 0.625rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in oklch, var(--foreground) 15%, transparent), var(--background);
    background: var(--background);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .backdrop {
    position: fixed;
    inset: 0;
    background: color-mix(in oklch, black 50%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dialog {
    width: 24rem;
    background: var(--card);
    color: var(--card-foreground);
    border-radius: var(--radius);
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    padding: 1.5rem;
  }
  .dialog h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 1rem; }
  label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
  input {
    width: 100%;
    height: 2.25rem;
    padding: 0 0.75rem;
    font-size: 0.875rem;
    background: transparent;
    color: var(--card-foreground);
    border: 1px solid var(--input);
    border-radius: calc(var(--radius) - 2px);
  }
  .footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem; }
  button {
    height: 2.25rem;
    padding: 0 1rem;
    border-radius: calc(var(--radius) - 2px);
    font-size: 0.875rem;
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-outline { background: transparent; color: var(--card-foreground); border-color: var(--border); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
</style>
</head>
<body>
  <div class="backdrop">
    <div class="dialog">
      <h1>New document</h1>
      <label for="title">Title</label>
      <input id="title" placeholder="Untitled" />
      <div class="footer">
        <button class="btn-outline">Cancel</button>
        <button class="btn-primary">Create</button>
      </div>
    </div>
  </div>
</body>
</html>
