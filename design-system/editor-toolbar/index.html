<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Editor toolbar &amp; typography</title>
<style>
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --border: oklch(0.922 0 0);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --popover: oklch(0.205 0 0);
      --popover-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --border: oklch(1 0 0 / 10%);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, system-ui, sans-serif;
    max-width: 40rem;
  }
  h2 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground); margin: 2rem 0 0.75rem; }
  .toolbar {
    display: inline-flex;
    align-items: center;
    gap: 0.125rem;
    background: var(--popover);
    color: var(--popover-foreground);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    padding: 0.25rem;
  }
  .toolbar button {
    width: 1.75rem;
    height: 1.75rem;
    border: none;
    background: transparent;
    color: var(--popover-foreground);
    border-radius: 0.25rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .toolbar button:hover, .toolbar button.active { background: var(--accent); color: var(--accent-foreground); }
  .toolbar .sep { width: 1px; height: 1.25rem; background: var(--border); margin: 0 0.25rem; }

  .prose h1 { font-size: 1.875rem; font-weight: 700; margin: 1.5rem 0 0.5rem; }
  .prose h2 { font-size: 1.5rem; font-weight: 700; margin: 1.25rem 0 0.5rem; text-transform: none; letter-spacing: normal; color: inherit; }
  .prose p { line-height: 1.75; margin: 0.5rem 0; }
  .prose a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
  .prose blockquote { border-left: 3px solid var(--border); margin: 0.75rem 0; padding-left: 1rem; color: var(--muted-foreground); }
  .prose code { background: var(--muted); border-radius: 0.25rem; font-family: ui-monospace, monospace; padding: 0.125rem 0.375rem; }
  .prose pre { background: var(--muted); border-radius: 0.375rem; padding: 0.75rem 1rem; font-family: ui-monospace, monospace; overflow-x: auto; }
</style>
</head>
<body>
  <h2>Floating (bubble) toolbar — appears on text selection</h2>
  <div class="toolbar">
    <button>H1</button><button>H2</button><button>H3</button>
    <span class="sep"></span>
    <button class="active"><b>B</b></button><button><i>I</i></button><button><u>U</u></button><button><s>S</s></button>
    <span class="sep"></span>
    <button style="color:#d97706">A</button><button>🔗</button>
    <span class="sep"></span>
    <button>❝</button><button>{ }</button>
    <span class="sep"></span>
    <button>• List</button><button>1. List</button>
  </div>

  <h2>Typography</h2>
  <div class="prose">
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <p>Regular paragraph text with a <a href="#">link</a> and some <code>inline code</code>.</p>
    <blockquote>A blockquote looks like this — muted color, left border.</blockquote>
    <pre>function hello() {
  return "code block";
}</pre>
  </div>
</body>
</html>
