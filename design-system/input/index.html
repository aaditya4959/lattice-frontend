<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Input</title>
<style>
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.625rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, system-ui, sans-serif;
    max-width: 20rem;
  }
  h2 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground); margin: 1.5rem 0 0.5rem; }
  label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
  input {
    width: 100%;
    height: 2.25rem;
    padding: 0 0.75rem;
    font-size: 0.875rem;
    color: var(--foreground);
    background: transparent;
    border: 1px solid var(--input);
    border-radius: calc(var(--radius) - 2px);
    outline: none;
  }
  input:focus {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent);
  }
  input.error { border-color: var(--destructive); }
  input.error:focus { box-shadow: 0 0 0 3px color-mix(in oklch, var(--destructive) 30%, transparent); }
  input:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 0.8rem; color: var(--muted-foreground); margin-top: 0.375rem; }
  .error-text { font-size: 0.8rem; color: var(--destructive); margin-top: 0.375rem; }
  .field { margin-bottom: 1rem; }
</style>
</head>
<body>
  <h2>Default</h2>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />
  </div>

  <h2>With error</h2>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" class="error" type="password" value="short" />
    <p class="error-text">Password must be at least 8 characters</p>
  </div>

  <h2>Disabled</h2>
  <div class="field">
    <input disabled value="Read-only value" />
  </div>
</body>
</html>
