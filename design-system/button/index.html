<!-- @dsCard group="Buttons" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Button</title>
<style>
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --radius: 0.625rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --secondary-foreground: oklch(0.985 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  h2 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground); margin: 1.5rem 0 0.75rem; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    border-radius: calc(var(--radius) - 2px);
    font-size: 0.875rem;
    font-weight: 500;
    height: 2.25rem;
    padding: 0 1rem;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.15s, opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  .btn-default { background: var(--primary); color: var(--primary-foreground); }
  .btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
  .btn-outline { background: transparent; color: var(--foreground); border-color: var(--border); }
  .btn-ghost { background: transparent; color: var(--foreground); }
  .btn-ghost:hover { background: var(--accent); opacity: 1; }
  .btn-destructive { background: var(--destructive); color: white; }
  .size-sm { height: 1.75rem; padding: 0 0.75rem; font-size: 0.8rem; }
  .size-icon { height: 2.25rem; width: 2.25rem; padding: 0; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <h2>Variants</h2>
  <div class="row">
    <button class="btn-default">Default</button>
    <button class="btn-secondary">Secondary</button>
    <button class="btn-outline">Outline</button>
    <button class="btn-ghost">Ghost</button>
    <button class="btn-destructive">Destructive</button>
  </div>

  <h2>Sizes</h2>
  <div class="row">
    <button class="btn-default size-sm">Small</button>
    <button class="btn-default">Default</button>
    <button class="btn-default size-icon">＋</button>
  </div>

  <h2>Disabled</h2>
  <div class="row">
    <button class="btn-default" disabled>Default</button>
    <button class="btn-outline" disabled>Outline</button>
  </div>
</body>
</html>
